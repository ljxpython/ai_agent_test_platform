[project]
name = "backend"
version = "0.1.0"
description = "Backend Python project (uv-managed)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlglot>=25,<26",
    "langgraph>=0.4,<0.5",
    "langgraph-cli[inmem]>=0.4,<0.5",
    "langgraph-api>=0.4,<0.5",
    "fastapi>=0.110,<1",
    "uvicorn>=0.27,<1",
    "httpx>=0.27,<1",
    "langchain-community>=0.4,<0.5",
    "openai>=1,<2",
    "PyJWT>=2.8,<3",
    "sqlalchemy>=2,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.1,<4",
    "pytest>=8,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# 当前任务只需要锁定 Python 版本并生成虚拟环境，不发布/安装本地包。
package = false
